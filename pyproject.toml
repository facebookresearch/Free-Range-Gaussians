[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "free-range-gaussians"
version = "1.0.0"
description = "Standalone inference package for the Free-Range Gaussians v52 8k model"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "einops>=0.8,<0.9",
  "gsplat>=1.4,<2",
  "huggingface-hub>=0.34,<1",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "plyfile>=1.1,<2",
  "PyYAML>=6,<7",
  "torch>=2.5,<2.8",
  "transformers>=4.46,<5",
]

[project.scripts]
free-range-gs-infer = "free_range_gs.infer:main"

[tool.setuptools]
packages = ["free_range_gs"]

[tool.setuptools.package-data]
free_range_gs = ["config.yaml", "dinov2_config.json"]
